<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Sign In | Election Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/eid.css" />
  </head>
  <body class="eid eid-login" data-theme="dark">
    <main class="eid-login-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
        <div class="eid-brand-mark"><span class="msi" style="font-size:20px">admin_panel_settings</span></div>
        <div>
          <div style="font-size:13px;font-weight:600">Election Intelligence</div>
          <div style="font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)">Admin portal</div>
        </div>
      </div>
      <span class="eid-kicker">Restricted</span>
      <h1>Sign in to Admin</h1>
      <p>Use your local admin username and password. Google sign-in is no longer used.</p>
      <form id="loginForm" class="eid-login-form" autocomplete="on">
        <label class="eid-login-label" for="username">Username</label>
        <input id="username" class="eid-input" name="username" type="text" autocomplete="username" required autofocus />
        <label class="eid-login-label" for="password">Password</label>
        <input id="password" class="eid-input" name="password" type="password" autocomplete="current-password" required />
        <button class="primary-action" type="submit" id="loginButton">Sign in</button>
        <p class="eid-login-error" id="loginError" role="alert" hidden></p>
      </form>
      <a class="subtle-link" href="index.html#/welcome">Back to dashboard</a>
    </main>
    <script>
      (function () {
        const theme = localStorage.getItem("electionDashboardTheme") === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.body.dataset.theme = theme;

        const form = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const loginButton = document.getElementById('loginButton');

        fetch('/api/admin/me', { credentials: 'include', cache: 'no-store' })
          .then((response) => {
            if (response.ok) window.location.replace('/admin/');
          })
          .catch(() => {});

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          loginError.hidden = true;
          loginError.textContent = '';
          loginButton.disabled = true;
          loginButton.textContent = 'Signing in…';

          try {
            const response = await fetch('/api/admin/login', {
              method: 'POST',
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
              }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(data.error || 'Sign-in failed.');
            }
            window.location.replace('/admin/');
          } catch (error) {
            loginError.textContent = error.message || 'Sign-in failed.';
            loginError.hidden = false;
            loginButton.disabled = false;
            loginButton.textContent = 'Sign in';
          }
        });
      })();
    </script>
  </body>
</html>
